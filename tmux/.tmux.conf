# ==========================================
# GENERAL SETTINGS
# ==========================================

# -- Ghostty & True Color support
set -g default-terminal "tmux-256color"
# Enable true color support (crucial for modern terminals like Ghostty and Neovim themes)
set-option -sa terminal-overrides ",xterm*:Tc"

# Images support
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enable mouse support (scrolling, clicking panes)
set -g mouse on

# Start windows and panes at 1, not 0 (better for keyboard ergonomics)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# StatusBar Up:
set -g status-position top

# --- ESCUDO CONTRA DEBIAN ---
# Esto bloquea que Bash inyecte el "superDebian" en la ventana
set-option -g allow-rename off
set-window-option -g automatic-rename off


# ==========================================
# Tema
# ==========================================

# Forzar la barra de estado a ser completamente transparente
set -g status-bg default
set -g status-style bg=default
set -g status-fg "#767c9d"

# Lado Izquierdo: Solo el nombre de la sesión en color azul sutil
set -g status-left "#[fg=#7aa2f7,bold] #S #[default]  "
set -g status-left-length 20

# Lado Derecho: Vacío (sin reloj ni nombre del host para cero distracciones)
set -g status-right ""

# Estilo de las ventanas (pestañas)
# Inactivas: gris oscuro
set -g window-status-format "#[fg=#545c7e] #I:#W "
# Activa: gris claro y en negritas
set -g window-status-current-format "#[fg=#c8d3f5,bold] #I:#W *"

# Color de las líneas separadoras de paneles (splits)
set -g pane-border-style fg=#1e1e2e
set -g pane-active-border-style fg=#545c7e


# ==========================================
# PLUGINS
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Seamless navigation between Neovim splits and tmux panes
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
