# ==========================================
# GENERAL SETTINGS
# ==========================================

# -- Ghostty support
# Enable true color support (crucial for modern terminals like Ghostty)
set-option -sa terminal-overrides ",xterm*:Tc"
# Images support
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enable mouse support (scrolling, clicking panes)
set -g mouse on

# Start windows and panes at 1, not 0 (better for keyboard ergonomics)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# StatusBar Up:
set -g status-position top

# --- ESCUDO CONTRA DEBIAN ---
# Esto bloquea que Bash inyecte el "superDebian" en la ventana
set-option -g allow-rename off
set-window-option -g automatic-rename off


# ==========================================
# PLUGINS
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Seamless navigation between Neovim splits and tmux panes
set -g @plugin 'christoomey/vim-tmux-navigator'

# ==========================================
# Theme
# ==========================================

set -g @plugin 'catppuccin/tmux#v0.3.0' 
set -g @catppuccin_flavor 'mocha'

# Configuración de las "Burbujas" (Pills)
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{b:pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
